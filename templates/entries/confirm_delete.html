{% extends 'base.html' %}

{% block title %}Удаление записи{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow">
            <div class="card-header bg-danger text-white">
                <h4 class="mb-0"><i class="bi bi-exclamation-triangle"></i> Подтверждение удаления</h4>
            </div>
            <div class="card-body text-center">
                <div class="mb-4">
                    <i class="bi bi-trash3" style="font-size: 4rem; color: #dc3545;"></i>
                </div>
                <h5>Вы уверены, что хотите удалить запись?</h5>
                <p class="text-muted">"{{ entry.title }}"</p>
                <p class="text-danger small">Это действие невозможно отменить!</p>

                <form method="post" class="mt-4">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-danger">
                        <i class="bi bi-trash"></i> Да, удалить
                    </button>
                    <a href="{% url 'entries:detail' entry.pk %}" class="btn btn-secondary">
                        <i class="bi bi-x-circle"></i> Отмена
                    </a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
